name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: tesserix/tesserix-workflows/.github/workflows/go-ci.yml@v2.1.0
    with:
      go_version: "1.26.x"
      coverage_min_lines: 10

