apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxdatasyncs.devai.tesserix.io
spec:
  group: devai.tesserix.io
  names:
    kind: SandboxDataSync
    plural: sandboxdatasyncs
    singular: sandboxdatasync
    shortNames: [sds]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [schedule, source, target, anonymizationSaltSecretRef, tables]
              properties:
                schedule: {type: string, pattern: '^(@(annually|yearly|monthly|weekly|daily|hourly|reboot)|([^ ]+ +){4}[^ ]+)$'}
                source:
                  type: object
                  required: [secretRef]
                  properties:
                    secretRef:
                      type: object
                      required: [name, key]
                      properties: {name: {type: string, minLength: 1}, key: {type: string, minLength: 1}}
                target:
                  type: object
                  required: [secretRef]
                  properties:
                    secretRef:
                      type: object
                      required: [name, key]
                      properties: {name: {type: string, minLength: 1}, key: {type: string, minLength: 1}}
                anonymizationSaltSecretRef:
                  type: object
                  required: [name, key]
                  properties: {name: {type: string, minLength: 1}, key: {type: string, minLength: 1}}
                tables:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [source, target, columns]
                    properties:
                      source: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*$'}
                      target: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*$'}
                      columns:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required: [name, transform]
                          properties:
                            name: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
                            transform: {type: string, enum: [email, name, hash, redact, preserve]}
      subresources: {status: {}}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
