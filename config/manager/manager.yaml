apiVersion: v1
kind: ServiceAccount
metadata:
  name: devai-sandbox-operator
  namespace: devai-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devai-sandbox-operator
subjects:
  - kind: ServiceAccount
    name: devai-sandbox-operator
    namespace: devai-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devai-sandbox-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devai-sandbox-operator
  namespace: devai-system
spec:
  replicas: 1
  selector: {matchLabels: {app: devai-sandbox-operator}}
  template:
    metadata: {labels: {app: devai-sandbox-operator}}
    spec:
      serviceAccountName: devai-sandbox-operator
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: manager
          image: ghcr.io/tesserix/devai-sandbox-operator:v0.1.0
          args: [--sync-image=ghcr.io/tesserix/devai-sandbox-sync:v0.1.0]
          ports:
            - name: healthz
              containerPort: 8081
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: healthz}
          readinessProbe:
            httpGet: {path: /readyz, port: healthz}
