apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devai-sandbox-operator
rules:
  - apiGroups: [devai.tesserix.io]
    resources: [sandboxdatasyncs]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
