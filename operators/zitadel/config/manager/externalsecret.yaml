apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zitadel-operator-machine-key
  namespace: identity-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: zitadel-operator-machine-key
    creationPolicy: Owner
  data:
    - secretKey: machine-key.json
      remoteRef:
        key: prod-onboarding-zitadel-machine-key
