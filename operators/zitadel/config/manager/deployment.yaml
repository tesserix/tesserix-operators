apiVersion: v1
kind: Namespace
metadata:
  name: identity-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-operator
  namespace: identity-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-operator
  namespace: identity-operator
rules:
  - apiGroups: [identity.tesserix.app]
    resources: [zitadelprojects, zitadelapplications]
    verbs: [get, list, watch]
  - apiGroups: [identity.tesserix.app]
    resources: [zitadelprojects/status, zitadelapplications/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-operator
  namespace: identity-operator
subjects:
  - kind: ServiceAccount
    name: zitadel-operator
    namespace: identity-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-operator
  namespace: identity-operator
  labels:
    app.kubernetes.io/name: zitadel-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-operator
    spec:
      serviceAccountName: zitadel-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/tesserix/tesserix-operators:replace-with-immutable-digest
          imagePullPolicy: IfNotPresent
          args: ["--watch-namespace=identity-operator"]
          ports:
            - name: healthz
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
          volumeMounts:
            - name: management-token
              mountPath: /var/run/zitadel-admin
              readOnly: true
      volumes:
        - name: management-token
          secret:
            secretName: zitadel-operator-machine-key
            defaultMode: 0400
