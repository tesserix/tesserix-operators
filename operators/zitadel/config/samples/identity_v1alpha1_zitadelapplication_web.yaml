apiVersion: identity.tesserix.app/v1alpha1
kind: ZitadelApplication
metadata:
  name: example-web
  namespace: identity-operator
spec:
  projectRef:
    name: example-product
  displayName: Example Product Web
  applicationType: web
  loginBaseUri: https://login.example.com
  refreshToken: false
  redirectUris:
    - https://app.example.com/auth/callback
  postLogoutRedirectUris:
    - https://app.example.com/login
