apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelmachineusers.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelMachineUser
    listKind: ZitadelMachineUserList
    plural: zitadelmachineusers
    singular: zitadelmachineuser
    shortNames:
      - zmu
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [organization, userName, displayName, credential]
              properties:
                organization:
                  type: string
                  maxLength: 200
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: organization is immutable
                  minLength: 1
                userName:
                  type: string
                  pattern: '^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: userName is immutable
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                credential:
                  type: string
                  enum: [personalAccessToken, clientSecret]
                  description: The credential published to the claim's reviewed OpenBao path. Never written to the claim.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: credential is immutable
            status:
              type: object
              properties:
                userId:
                  type: string
                clientId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
