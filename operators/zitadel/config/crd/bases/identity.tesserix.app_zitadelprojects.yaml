apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelprojects.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelProject
    listKind: ZitadelProjectList
    plural: zitadelprojects
    singular: zitadelproject
    shortNames:
      - zproject
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - displayName
                - organization
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                organization:
                  type: string
                  minLength: 1
                  maxLength: 200
                access:
                  type: object
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - public
                        - restricted
                    members:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required:
                          - email
                        properties:
                          email:
                            type: string
                            minLength: 3
                            maxLength: 320
                          roles:
                            type: array
                            maxItems: 20
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
            status:
              type: object
              properties:
                projectId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
