apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelprojects.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelProject
    listKind: ZitadelProjectList
    plural: zitadelprojects
    singular: zitadelproject
    shortNames:
      - zproject
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: '!has(oldSelf.consumerOrganization) || has(self.consumerOrganization)'
                  message: consumer organization management cannot be removed
                - rule: '!has(self.consumerOrganization) || (has(self.access) && self.access.mode == "public")'
                  message: consumer organizations require public project access
              required:
                - displayName
                - organization
              properties:
                consumerOrganization:
                  type: object
                  required: [initialAdminUserId, providers, primaryColor, backgroundColor, fontColor]
                  properties:
                    initialAdminUserId:
                      type: string
                      minLength: 1
                      maxLength: 200
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: initial administrator is immutable
                    primaryColor: {type: string, pattern: '^#[A-Fa-f0-9]{6}$'}
                    backgroundColor: {type: string, pattern: '^#[A-Fa-f0-9]{6}$'}
                    fontColor: {type: string, pattern: '^#[A-Fa-f0-9]{6}$'}
                    providers:
                      type: array
                      minItems: 1
                      maxItems: 3
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [kind]
                      items:
                        type: object
                        required: [kind, secretName]
                        properties:
                          kind: {type: string, enum: [google, apple, facebook]}
                          secretName: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z][a-z0-9-]+$'}
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                organization:
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: organization is immutable
                  minLength: 1
                  maxLength: 200
                access:
                  type: object
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - public
                        - restricted
                        - organization
                    members:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required:
                          - email
                        properties:
                          email:
                            type: string
                            minLength: 3
                            maxLength: 320
                          roles:
                            type: array
                            maxItems: 30
                            items:
                              type: string
                              minLength: 1
                              maxLength: 100
            status:
              type: object
              properties:
                consumerIdentity:
                  type: object
                  required: [organizationId, providerIds]
                  properties:
                    organizationId: {type: string}
                    providerIds:
                      type: object
                      additionalProperties: {type: string}
                    credentialDigests:
                      type: object
                      additionalProperties: {type: string, pattern: '^[a-f0-9]{64}$'}
                projectId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
