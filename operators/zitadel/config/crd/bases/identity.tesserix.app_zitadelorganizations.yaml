apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelorganizations.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelOrganization
    listKind: ZitadelOrganizationList
    plural: zitadelorganizations
    singular: zitadelorganization
    shortNames: [zorg]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [product, tenantId, displayName, initialAdminUserId]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Hospital identity bindings are immutable; use a reviewed migration.
                - rule: '!has(self.preserveLoginPolicy) || !self.preserveLoginPolicy || has(self.organizationId)'
                  message: Policy preservation is adoption-only.
              properties:
                initialAdminUserId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,200}$'
                product:
                  type: string
                  maxLength: 25
                  pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
                tenantId:
                  type: string
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                organizationId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,200}$'
                preserveLoginPolicy:
                  type: boolean
            status:
              type: object
              properties:
                activated: {type: boolean}
                organizationId: {type: string}
                projectId: {type: string}
                archiveObject: {type: string}
                archiveGeneration: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
