apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelapplications.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelApplication
    listKind: ZitadelApplicationList
    plural: zitadelapplications
    singular: zitadelapplication
    shortNames:
      - zapp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectRef, displayName, applicationType, redirectUris]
              properties:
                projectRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                applicationType:
                  type: string
                  enum: [native, user_agent]
                redirectUris:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
                postLogoutRedirectUris:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
            status:
              type: object
              properties:
                appId:
                  type: string
                clientId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
