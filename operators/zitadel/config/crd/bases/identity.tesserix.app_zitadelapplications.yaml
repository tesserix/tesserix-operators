apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zitadelapplications.identity.tesserix.app
spec:
  group: identity.tesserix.app
  names:
    kind: ZitadelApplication
    listKind: ZitadelApplicationList
    plural: zitadelapplications
    singular: zitadelapplication
    shortNames:
      - zapp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectRef, displayName, applicationType, redirectUris]
              properties:
                projectRef:
                  type: object
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: projectRef is immutable
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                applicationType:
                  type: string
                  enum: [native, user_agent, web]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: applicationType is immutable
                loginBaseUri:
                  type: string
                  maxLength: 2000
                  description: Product-hosted HTTPS Login V2 base URI. Empty selects the instance Login V2 UI; omission preserves adopted settings.
                refreshToken:
                  type: boolean
                  description: Controls refresh grants. Omission preserves an adopted client's refresh grant; all other declared OIDC settings are reconciled.
                accessTokenType:
                  type: string
                  enum: [jwt, bearer]
                  description: Defaults to jwt. Opaque bearer tokens require introspection when used for API authentication.
                idTokenUserinfoAssertion:
                  type: boolean
                  description: Defaults to true for existing BFF consumers. False keeps email/profile out of the ID token when an access token is also issued.
                redirectUris:
                  type: array
                  minItems: 1
                  maxItems: 100
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
                postLogoutRedirectUris:
                  type: array
                  maxItems: 100
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    maxLength: 2000
            status:
              type: object
              properties:
                appId:
                  type: string
                clientId:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
