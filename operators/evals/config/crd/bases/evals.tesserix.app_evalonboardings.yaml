apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: evalonboardings.evals.tesserix.app
spec:
  group: evals.tesserix.app
  names:
    kind: EvalOnboarding
    plural: evalonboardings
    singular: evalonboarding
    shortNames: [evalclaim]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Project
          type: string
          jsonPath: .status.projectId
        - name: Datasets
          type: integer
          jsonPath: .status.datasetsRegistered
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 200}
                datasets:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name, modality]
                    properties:
                      name: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9][a-z0-9-]*$'}
                      modality: {type: string, enum: [agent, retrieval, ocr, transcription]}
                      description: {type: string, maxLength: 1000}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
