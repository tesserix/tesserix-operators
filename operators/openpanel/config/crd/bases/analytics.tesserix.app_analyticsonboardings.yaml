apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: analyticsonboardings.analytics.tesserix.app
spec:
  group: analytics.tesserix.app
  names:
    kind: AnalyticsOnboarding
    plural: analyticsonboardings
    singular: analyticsonboarding
    shortNames: [analyticsclaim]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Project
          type: string
          jsonPath: .status.projectId
        - name: Client ID Secret
          type: string
          jsonPath: .status.clientIdSecret
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [displayName, domain, cors]
              properties:
                displayName: {type: string, minLength: 1, maxLength: 200}
                domain: {type: string, minLength: 8, maxLength: 2000, pattern: '^https?://'}
                cors:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {type: string, minLength: 8, maxLength: 2000, pattern: '^https?://'}
                types:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: {type: string, enum: [website, app, backend]}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
